spring.application.name=VetTurno
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:13306/vetturno}
spring.datasource.username=${DB_USER:vetturno}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:America/Santiago}
spring.jackson.time-zone=${APP_TIME_ZONE:America/Santiago}
spring.jackson.deserialization.fail-on-unknown-properties=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.time-zone=${APP_TIME_ZONE:America/Santiago}
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:PT1H}
app.jwt.issuer=vetturno
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operations-sorter=alpha
